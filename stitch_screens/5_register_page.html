<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - PawConnect India</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed-dim": "#4edea3",
                    "on-primary-fixed-variant": "#783200",
                    "on-primary-fixed": "#341100",
                    "on-secondary-fixed-variant": "#005236",
                    "on-tertiary-container": "#1304ac",
                    "primary-container": "#f97316",
                    "tertiary-fixed": "#e1e0ff",
                    "tertiary-container": "#8c8fff",
                    "on-secondary": "#ffffff",
                    "secondary": "#006c49",
                    "inverse-primary": "#ffb690",
                    "error": "#ba1a1a",
                    "surface-bright": "#faf8ff",
                    "inverse-surface": "#283044",
                    "primary": "#9d4300",
                    "outline": "#8c7164",
                    "on-error": "#ffffff",
                    "secondary-fixed": "#6ffbbe",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#e0c0b1",
                    "on-secondary-container": "#00714d",
                    "surface-container-highest": "#dae2fd",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#f2f3ff",
                    "on-primary": "#ffffff",
                    "surface-dim": "#d2d9f4",
                    "primary-fixed": "#ffdbca",
                    "on-error-container": "#93000a",
                    "on-background": "#131b2e",
                    "inverse-on-surface": "#eef0ff",
                    "on-primary-container": "#582200",
                    "surface-container": "#eaedff",
                    "on-surface": "#131b2e",
                    "tertiary-fixed-dim": "#c0c1ff",
                    "tertiary": "#494bd6",
                    "on-secondary-fixed": "#002113",
                    "background": "#faf8ff",
                    "surface": "#faf8ff",
                    "surface-variant": "#dae2fd",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#ffb690",
                    "surface-tint": "#9d4300",
                    "on-surface-variant": "#584237",
                    "secondary-container": "#6cf8bb",
                    "on-tertiary-fixed": "#07006c",
                    "surface-container-high": "#e2e7ff",
                    "on-tertiary-fixed-variant": "#2f2ebe"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "20px",
                    "base": "4px",
                    "xs": "4px",
                    "margin-mobile": "16px",
                    "margin-desktop": "40px",
                    "lg": "24px",
                    "sm": "8px",
                    "2xl": "48px",
                    "3xl": "64px",
                    "md": "16px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "display-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-sm": ["Inter"],
                    "display-lg-mobile": ["Inter"],
                    "label-md": ["Inter"],
                    "label-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col md:flex-row">
<!-- Left Visual Panel (Hidden on Mobile) -->
<div class="hidden md:flex md:w-1/2 relative bg-surface-variant flex-col justify-end p-margin-desktop">
<div class="absolute inset-0 bg-cover bg-center bg-no-repeat" data-alt="A heartwarming, professional high-resolution photograph of a dedicated animal rescue volunteer gently comforting a rescued stray dog. The scene is bathed in warm, soft, natural light, reflecting the minimalist and trustworthy aesthetic of a modern civic-tech platform. The composition uses generous negative space, subtle earthy tones, and crisp details to evoke feelings of hope, reliability, and institutional trust, aligning perfectly with a premium SaaS brand identity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBCPghviCGb-w28_8pFhxZ2YtCne5kQnSPvVM0AdpEV47LhkrnYFfu-cGSUqliKE7tkqUG_UTbFkIHmYjBQfm7q4TRVdnL4T3mMT-jITfiNUs_LjqsYf1FGLZptPIQHmGFQ2jVBnm0G43d7O-8yx7shmub__iEnu-R6GDNPLfMp6m8KIYUQloAutCt5k8uy0iromusb0v_ERBxl8nZbOivq9ds9icjce9iSVw9amPPmRKhQp4zlslAz')">
<!-- Subtle gradient overlay for text legibility if needed later -->
<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/80 to-transparent"></div>
</div>
<div class="relative z-10 text-on-primary">
<h2 class="font-headline-md text-headline-md text-surface-container-lowest mb-sm">Every life matters.</h2>
<p class="font-body-lg text-body-lg text-surface-container-lowest/80 max-w-md">Join a community dedicated to the welfare of street animals. Fast reporting, rapid response, and a modern approach to civic care.</p>
</div>
</div>
<!-- Right Registration Form Panel -->
<div class="flex-1 flex flex-col justify-center items-center p-margin-mobile md:p-margin-desktop bg-surface relative">
<!-- Mobile Logo (Visible only on mobile) -->
<div class="absolute top-margin-mobile left-margin-mobile md:hidden flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">pets</span>
<span class="font-headline-sm text-headline-sm font-bold text-primary">PawConnect</span>
</div>
<div class="w-full max-w-[420px] mx-auto mt-12 md:mt-0">
<!-- Header -->
<div class="mb-xl text-center md:text-left">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-sm">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign up to start reporting and rescuing.</p>
</div>
<!-- Form -->
<form class="space-y-md">
<!-- Full Name -->
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow" id="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<!-- Phone Number -->
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface" for="phone">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">call</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow" id="phone" placeholder="+91 98765 43210" type="tel"/>
</div>
</div>
<!-- Password Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Password -->
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface" for="confirmPassword">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock_reset</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start mt-lg">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2 cursor-pointer mt-1" id="terms" type="checkbox"/>
</div>
<label class="ml-2 font-body-md text-body-md text-on-surface-variant cursor-pointer" for="terms">
                        I accept the <a class="text-primary hover:underline font-label-md" href="#">Terms & Conditions</a> and Privacy Policy.
                    </label>
</div>
<!-- Submit Action -->
<div class="pt-sm">
<button class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-secondary bg-secondary hover:bg-secondary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors min-h-[44px]" type="button">
                        Create Account
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Login Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors ml-1 hover:underline" href="#">Log In</a>
</p>
</div>
</div>
</div>
</body></html>
